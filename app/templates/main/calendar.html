{% extends "base.html" %}

{% block head %}
<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1"><i class="bi bi-calendar3 me-2 text-primary"></i>{{ _('Event Calendar') }}</h2>
        <p class="text-muted mb-0">{{ _('View all campus events at a glance') }}</p>
    </div>
</div>

<!-- Category Legend -->
<div class="d-flex flex-wrap gap-2 mb-4">
    {% for category in categories %}
    <span class="badge" style="background: {{ category.color }};">
        <i class="{{ category.icon }} me-1"></i>{{ category.get_name(current_language) }}
    </span>
    {% endfor %}
</div>

<!-- Calendar Container -->
<div class="card shadow-sm border-0">
    <div class="card-body">
        <div id="calendar"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: '{{ current_language }}',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            events: '{{ url_for("events.api_events") }}',
            eventClick: function (info) {
                window.location.href = info.event.url;
                info.jsEvent.preventDefault();
            },
            height: 'auto',
            eventTimeFormat: {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
