{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
    </div>
    <h1 class="display-4 fw-bold text-muted">404</h1>
    <h2 class="mb-3">{{ _('Page Not Found') }}</h2>
    <p class="text-muted mb-4">
        {{ _("Sorry, the page you're looking for doesn't exist or has been removed.") }}
    </p>
    <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house me-2"></i>{{ _('Go Home') }}
        </a>
        <a href="{{ url_for('events.list_events') }}" class="btn btn-outline-primary btn-lg">
            <i class="bi bi-calendar-event me-2"></i>{{ _('Browse Events') }}
        </a>
    </div>
</div>
{% endblock %}
