{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="bi bi-bug display-1 text-danger"></i>
    </div>
    <h1 class="display-4 fw-bold text-muted">500</h1>
    <h2 class="mb-3">{{ _('Server Error') }}</h2>
    <p class="text-muted mb-4">
        {{ _("Something went wrong on our end. Please try again later.") }}
    </p>
    <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house me-2"></i>{{ _('Go Home') }}
        </a>
        <a href="javascript:location.reload()" class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-arrow-clockwise me-2"></i>{{ _('Try Again') }}
        </a>
    </div>
</div>
{% endblock %}
