services:
  - type: web
    name: campus-events
    runtime: python
    buildCommand: pip install -r requirements.txt && python run.py init-db
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
